name: Release rubrical

on:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions: write-all

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        # Solely for the runtime stage's `adduser`, which runs on the target
        # platform. Every compile stage in the Dockerfile is pinned to
        # $BUILDPLATFORM and cross-compiles, so no build work is emulated.
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        # Not optional housekeeping: the default `docker` driver cannot
        # produce a multi-platform result, so the `platforms:` input below
        # fails the build without this rather than being quietly ignored.
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          # A manifest list carries the same tags a single-platform image
          # did — the registry hands each node its own architecture at pull
          # time — so metadata-action's config and tangle-deployments'
          # image.tag bump (ADR 0021) need no change.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27
          cache: true   # default; explicit for clarity
      - name: Install Task
        uses: ./.github/actions/setup-task
      - name: Install Go dependencies
        run: task go:install-ci
      - name: Generate Swagger docs
        run: task go:generate
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          # 'latest', 'nightly', or a semver
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_HOMBREW_AUTH_TOKEN: ${{ secrets.HOMEBREW_AUTH_TOKEN }}

  notify-tangle-deployments:
    runs-on: ubuntu-latest
    if: github.event.release.prerelease == false
    steps:
      - name: Dispatch chart bump
        run: |
          gh api repos/ivanklee86/tangle-deployments/dispatches \
            -f event_type=tangle-release \
            -f "client_payload[version]=${{ github.event.release.tag_name }}"
        env:
          GH_TOKEN: ${{ secrets.TANGLE_DEPLOYMENTS_DISPATCH_TOKEN }}
