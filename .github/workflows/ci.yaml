name: CI

on:
  push:
    branches:
      - 'main'
  pull_request:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  filter:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      ts: ${{ steps.filter.outputs.ts }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
    - uses: actions/checkout@v7
    - uses: dorny/paths-filter@v4
      id: filter
      with:
        filters: |
          go:
            - '**/*.go'
            - 'go.mod'
            - 'go.sum'
            - 'Taskfile.yaml'
            - 'tasks/go.yaml'
            - 'tasks/docker.yaml'
            - 'tasks/k8s.yaml'
            - 'tasks/argocd.yaml'
            - 'Dockerfile'
            - '.github/workflows/ci.yaml'
          ts:
            - 'web/**'
            - 'Taskfile.yaml'
            - 'tasks/ts.yaml'
            - '.github/workflows/ci.yaml'
          docs:
            - 'docs/**'
            - '!docs/agents/**'
            - 'mkdocs.yml'
            - 'requirements.txt'
            - '.github/workflows/ci.yaml'

  go:
    needs: [filter]
    if: needs.filter.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Install Go
      uses: actions/setup-go@v7
      with:
        go-version: 1.27
        cache: true   # default; explicit for clarity
    - name: Check formatting
      run: |
        gofmt -d .
        test -z "$(gofmt -l .)"
    - name: Install Task
      uses: arduino/setup-task@v3.0.0
    - name: Cache Go tool binaries
      uses: actions/cache@v6
      with:
        path: ~/go/bin
        key: go-tools-${{ hashFiles('tasks/go.yaml') }}
    - name: Install all dependencies
      run: task go:install-ci
    - name: Generate OpenAPI spec
      run: task go:generate
    - name: Lint code.
      run: task go:lint
    - name: Run tests.
      run: task go:test-ci
    - name: Publish Unit Test Results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
        files: report.xml
    - name: Save coverage report.
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: go-coverage-report
        path: ./coverage.html
    - name: Save coverage profile.
      # Raw profile for the report job's centralized octocov run — octocov
      # moved there so it can merge this with e2e's own coverage-e2e.out
      # into one combined report instead of only ever seeing go's slice.
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: go-coverage-profile
        path: ./coverage.out
    - name: Save JUnit report.
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: go-junit-report
        path: ./report.xml

  ts:
    needs: [filter]
    if: needs.filter.outputs.ts == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Install Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: web/package-lock.json
    - name: Install Task
      uses: arduino/setup-task@v3.0.0
    - name: Install packages
      run: task ts:install
    - name: Cache Playwright browser
      id: playwright-cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        # Literal version, not a hash of web/package.json — this needs to
        # match exactly what's installed, and an unrelated package.json
        # change shouldn't accidentally bust this cache.
        key: playwright-${{ runner.os }}-1.63.0
    - name: Install Playwright browser
      # Invoke the locally installed `playwright` package directly rather
      # than `npx playwright@<version>` — this project also depends on
      # `@playwright/test`, which provides its own (older-pinned) `playwright`
      # bin under the same name, and `npx` resolves to that one instead of
      # the version requested, silently installing the wrong browser
      # revision. `node node_modules/playwright/cli.js` bypasses the bin
      # collision and always uses the exact version in web/package.json.
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: node node_modules/playwright/cli.js install --with-deps chromium chromium-headless-shell
      working-directory: web
    - name: Run unit tests
      run: task ts:test:unit
    - name: Run mocked e2e tests
      run: task ts:test:e2e
    - name: Lint code
      run: task ts:lint
    - name: Build website
      run: task ts:build
    - name: Save JUnit report.
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: ts-junit-report
        path: web/test-results/junit.xml

  docs:
    needs: [filter]
    if: needs.filter.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Install Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'
    - name: Install uv
      uses: astral-sh/setup-uv@v10.1.0
    - name: Install Task
      uses: arduino/setup-task@v3.0.0
    - name: Install dependencies
      run: task python:install:ci
    - name: Test docs
      run: task python:test

  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Install Go
      # go-fmt (dnephin/pre-commit-golang) is `language: script`, so prek
      # doesn't provision a Go toolchain for it — it just runs `gofmt`
      # against whatever's on PATH. Pin explicitly rather than relying on
      # the runner image's ambient Go version.
      uses: actions/setup-go@v7
      with:
        go-version: 1.27
        cache: true   # default; explicit for clarity
    - name: Run pre-commit hooks via prek
      # web-lint stays skipped here, same as it always was under
      # pre-commit.ci's `ci: skip:` — see .pre-commit-config.yaml's comment.
      uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
      env:
        SKIP: web-lint
      with:
        prek-version: 0.5.3

  e2e:
    runs-on: ubuntu-latest
    env:
      # Single source of truth for both CLI versions in this job (cache key
      # and install steps below all reference these instead of repeating the
      # literal) — tracked by renovate.json's "k8s" group alongside
      # .devcontainer/Dockerfile's own K3D_VERSION/argocd copies, so a
      # Renovate bump moves every occurrence together in one PR.
      K3D_VERSION: v5.9.0 # github-releases/k3d-io/k3d
      ARGOCD_VERSION: v3.5.3 # github-releases/argoproj/argo-cd
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Install Go
      uses: actions/setup-go@v7
      with:
        go-version: 1.27
        cache: true   # default; explicit for clarity
    - name: Install Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: web/package-lock.json
    - name: Install Task
      uses: arduino/setup-task@v3.0.0
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Expose GitHub Actions cache variables for buildx
      uses: crazy-max/ghaction-github-runtime@v4
    - name: Cache Go tool binaries
      uses: actions/cache@v6
      with:
        path: ~/go/bin
        key: go-tools-${{ hashFiles('tasks/go.yaml') }}
    - name: Cache k3d/argocd CLIs
      id: cli-tools-cache
      uses: actions/cache@v6
      with:
        path: |
          /usr/local/bin/k3d
          /usr/local/bin/argocd
        key: cli-tools-k3d-${{ env.K3D_VERSION }}-argocd-${{ env.ARGOCD_VERSION }}
    - name: Install k3d
      if: steps.cli-tools-cache.outputs.cache-hit != 'true'
      run: curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | TAG=${{ env.K3D_VERSION }} bash
    - name: Install argocd
      if: steps.cli-tools-cache.outputs.cache-hit != 'true'
      run: |
        curl -sSL -o argocd-linux-amd64 https://github.com/argoproj/argo-cd/releases/download/${{ env.ARGOCD_VERSION }}/argocd-linux-amd64
        sudo install -m 555 argocd-linux-amd64 /usr/local/bin/argocd
        rm argocd-linux-amd64
    - name: Install all dependencies
      run: task go:install-ci
    - name: Generate OpenAPI spec
      run: task go:generate
    - name: Bring up live stack
      run: task services:cicd
      env:
        DOCKER_BUILD_CACHE_FLAGS: --cache-from type=gha --cache-to type=gha,mode=max
    - name: Run Go e2e tests
      run: task go:test:e2e:ci
    - name: Install frontend packages
      run: task ts:install
    - name: Cache Playwright browser
      id: playwright-cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-1.63.0
    - name: Install Playwright browser
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: node node_modules/playwright/cli.js install --with-deps chromium chromium-headless-shell
      working-directory: web
    - name: Run frontend live e2e suite
      run: task ts:test:e2e:live
    - name: Publish Unit Test Results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
        files: |
          report-e2e.xml
          web/test-results/junit-live.xml
    - name: Save JUnit report.
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: e2e-junit-report
        path: |
          ./report-e2e.xml
          web/test-results/junit-live.xml
    - name: Save coverage profile.
      # For the report job's centralized octocov run — see the same step in
      # the go job. This is the *only* place e2e's own Go coverage gets
      # surfaced anywhere; today it's generated and then never looked at
      # again once it leaves this job.
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: e2e-coverage-profile
        path: ./coverage-e2e.out

  report:
    needs: [go, ts, e2e]
    if: always()
    runs-on: ubuntu-latest
    # Job-level permissions replace the workflow-level block entirely for
    # this job (they don't merge), so every scope its steps use has to be
    # re-listed here. actions: write moved here with octocov (workstream
    # 10 originally ran it in go) — it's for octocov's artifact:// datastore,
    # which reads/deletes prior coverage-report artifacts via the REST
    # Actions-artifacts API (authenticated with GITHUB_TOKEN, not the
    # separate runtime-token upload path actions/upload-artifact uses).
    permissions:
      contents: read
      checks: write
      pull-requests: write
      actions: write
    steps:
    - name: Checkout code
      # octocov needs the checked-out repo for .octocov.yml itself and for
      # git-root-relative path normalization — the JUnit-only version of
      # this job never needed one.
      uses: actions/checkout@v7
    - name: Download JUnit reports
      uses: actions/download-artifact@v8
      with:
        pattern: '*-junit-report'
        path: reports
        merge-multiple: true
    - name: Download coverage profiles
      # go's coverage.out and e2e's coverage-e2e.out land side by side here
      # (different filenames, no collision) — .octocov.yml's coverage.paths
      # lists both; octocov merges overlapping files itself (folding
      # duplicate-covered lines, not double-counting), so this becomes one
      # combined Go coverage report instead of go's slice alone. Each
      # pattern is globbed independently, so a skipped go job (path filter)
      # just leaves that one glob empty rather than erroring — e2e always
      # runs, so there's always at least its coverage to report on.
      uses: actions/download-artifact@v8
      with:
        pattern: '*-coverage-profile'
        path: coverage
        merge-multiple: true
    - name: Report coverage via octocov
      # Pinned to the exact commit v1 (currently v1.5.2) resolves to, not the
      # mutable tag — this step runs with actions: write, so a repointed tag
      # could swap in code that runs with that elevated token.
      uses: k1LoW/octocov-action@a167dc0dee441b7ffc45e1b862ab55ec0d87f278 # v1.5.2
      with:
        config: .octocov.yml
        version: v0.79.0
    - name: Publish unified test results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
        files: reports/*.xml
        check_name: 'Unified Test Results'
