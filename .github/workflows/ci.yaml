name: CI

on:
  push:
    branches:
      - 'main'
  pull_request:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  filter:
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
    steps:
    - uses: actions/checkout@v7
    - uses: dorny/paths-filter@v4
      id: filter
      with:
        filters: |
          docs:
            - 'docs/**'
            - '!docs/agents/**'
            - 'mkdocs.yml'
            - 'requirements.txt'
            - '.github/workflows/ci.yaml'

  go:
    # Explicit, or GitHub derives the check name from *every* matrix
    # dimension — `go (amd64, ubuntu-latest)` — which embeds the runner
    # label in a name branch protection depends on. A future
    # ubuntu-latest bump would then silently rename a required check.
    name: go (${{ matrix.arch }})
    strategy:
      # An arm64-only failure should still report the amd64 result, and vice
      # versa — telling the two apart is the entire diagnostic value of the
      # matrix, and fail-fast would throw it away exactly when it matters.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            # Free for public repositories. There is no `ubuntu-latest-arm`;
            # the version has to be named explicitly.
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Install Go
      uses: actions/setup-go@v7
      with:
        go-version: 1.27
        cache: true   # default; explicit for clarity
    - name: Check formatting
      run: |
        gofmt -d .
        test -z "$(gofmt -l .)"
    - name: Install Task
      uses: ./.github/actions/setup-task
    - name: Cache Go tool binaries
      uses: actions/cache@v6
      with:
        path: ~/go/bin
        # os/arch is load-bearing, not decoration: ~/go/bin holds compiled
        # binaries and this key is shared with the e2e job, across four
        # matrix legs on two architectures. Without it, whichever leg saves
        # first hands its binaries to every other leg, and the symptom is an
        # `exec format error` deep into an unrelated job.
        key: go-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tasks/go.yaml') }}
    - name: Install all dependencies
      run: task go:install-ci
    - name: Generate OpenAPI spec
      run: task go:generate
    - name: Lint code.
      run: task go:lint
    - name: Run tests.
      run: task go:test-ci
    - name: Publish Unit Test Results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
        files: report.xml
        # Explicit and unique. The action's default is the literal string
        # `Test Results`, and go and e2e both used to take that default — so
        # two check runs already shared one name, and four would now. The
        # report job's `Unified Test Results` stays the canonical merged
        # view; these are the per-leg detail views, and they're how an
        # arm64-only failure stays debuggable without entering that merge.
        check_name: Go Test Results (${{ matrix.arch }})
    - name: Save coverage report.
      uses: actions/upload-artifact@v7
      # amd64 only, here and on the two uploads below: both legs run the same
      # suite over the same source, and the report job merges fixed artifact
      # names (see .octocov.yml's coverage.paths). Coverage is a property of
      # the source, not the runner, so there is nothing to merge from the
      # arm64 leg — and uploading it would collide on artifact name.
      if: always() && matrix.arch == 'amd64'
      with:
        name: go-coverage-report
        path: ./coverage.html
    - name: Save coverage profile.
      # Raw profile for the report job's centralized octocov run — octocov
      # moved there so it can merge this with e2e's own coverage-e2e.out
      # into one combined report instead of only ever seeing go's slice.
      uses: actions/upload-artifact@v7
      if: always() && matrix.arch == 'amd64'
      with:
        name: go-coverage-profile
        path: ./coverage.out
    - name: Save JUnit report.
      uses: actions/upload-artifact@v7
      if: always() && matrix.arch == 'amd64'
      with:
        name: go-junit-report
        path: ./report.xml

  ts:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Install Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: web/package-lock.json
    - name: Install Task
      uses: ./.github/actions/setup-task
    - name: Install packages
      run: task ts:install-ci
    - name: Cache Playwright browser
      id: playwright-cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        # Literal version, not a hash of web/package.json — this needs to
        # match exactly what's installed, and an unrelated package.json
        # change shouldn't accidentally bust this cache.
        #
        # runner.arch matters as much as the version: this key is shared
        # with e2e, whose arm64 leg caches arm64 browser binaries, and
        # runner.os is `Linux` on both architectures.
        key: playwright-${{ runner.os }}-${{ runner.arch }}-1.63.0
    - name: Install Playwright browser
      # Invoke the locally installed `playwright` package directly rather
      # than `npx playwright@<version>` — this project also depends on
      # `@playwright/test`, which provides its own (older-pinned) `playwright`
      # bin under the same name, and `npx` resolves to that one instead of
      # the version requested, silently installing the wrong browser
      # revision. `node node_modules/playwright/cli.js` bypasses the bin
      # collision and always uses the exact version in web/package.json.
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: node node_modules/playwright/cli.js install --with-deps chromium chromium-headless-shell
      working-directory: web
    - name: Run unit tests
      run: task ts:test:unit
    - name: Run mocked e2e tests
      run: task ts:test:e2e
    - name: Lint code
      run: task ts:lint
    - name: Build website
      run: task ts:build
    - name: Save JUnit report.
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: ts-junit-report
        path: web/test-results/junit.xml

  docs:
    needs: [filter]
    if: needs.filter.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Install Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'
    - name: Install uv
      uses: astral-sh/setup-uv@v10.1.0
    - name: Install Task
      uses: ./.github/actions/setup-task
    - name: Install dependencies
      run: task python:install:ci
    - name: Test docs
      run: task python:test

  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Install Go
      # go-fmt (dnephin/pre-commit-golang) is `language: script`, so prek
      # doesn't provision a Go toolchain for it — it just runs `gofmt`
      # against whatever's on PATH. Pin explicitly rather than relying on
      # the runner image's ambient Go version.
      uses: actions/setup-go@v7
      with:
        go-version: 1.27
        cache: true   # default; explicit for clarity
    - name: Run pre-commit hooks via prek
      # web-lint stays skipped here, same as it always was under
      # pre-commit.ci's `ci: skip:` — see .pre-commit-config.yaml's comment.
      uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
      env:
        SKIP: web-lint
      with:
        prek-version: 0.5.3

  e2e:
    # See the go job — pins the check name against the runner label.
    name: e2e (${{ matrix.arch }})
    strategy:
      # Same shape as the go job's matrix, and for the same reason. The arch
      # values are Go's GOARCH spellings deliberately — the argocd install
      # below substitutes them straight into a release-asset name.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      # Single source of truth for both CLI versions in this job (cache key
      # and install steps below all reference these instead of repeating the
      # literal) — tracked by renovate.json's "k8s" group alongside
      # .devcontainer/Dockerfile's own K3D_VERSION/argocd copies, so a
      # Renovate bump moves every occurrence together in one PR.
      K3D_VERSION: v5.9.0 # github-releases/k3d-io/k3d
      ARGOCD_VERSION: v3.5.3 # github-releases/argoproj/argo-cd
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Install Go
      uses: actions/setup-go@v7
      with:
        go-version: 1.27
        cache: true   # default; explicit for clarity
    - name: Install Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: web/package-lock.json
    - name: Install Task
      uses: ./.github/actions/setup-task
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Expose GitHub Actions cache variables for buildx
      uses: crazy-max/ghaction-github-runtime@v4
    - name: Cache Go tool binaries
      uses: actions/cache@v6
      with:
        path: ~/go/bin
        # See the go job's copy of this key — same cache, same reason.
        key: go-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tasks/go.yaml') }}
    - name: Cache k3d/argocd CLIs
      id: cli-tools-cache
      uses: actions/cache@v6
      with:
        path: |
          /usr/local/bin/k3d
          /usr/local/bin/argocd
        # runner.arch is not optional here: without it the arm64 leg would
        # restore amd64 binaries, *hit* the cache, skip both install steps
        # below, and then fail with `exec format error` several minutes
        # later, after the cluster bring-up.
        key: cli-tools-${{ runner.arch }}-k3d-${{ env.K3D_VERSION }}-argocd-${{ env.ARGOCD_VERSION }}
    - name: Install k3d
      # No arch handling needed — install.sh detects it, and k3d publishes a
      # k3d-linux-arm64 asset.
      if: steps.cli-tools-cache.outputs.cache-hit != 'true'
      run: curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | TAG=${{ env.K3D_VERSION }} bash
    - name: Install argocd
      if: steps.cli-tools-cache.outputs.cache-hit != 'true'
      run: |
        # argo-cd names its release assets by GOARCH (argocd-linux-amd64,
        # argocd-linux-arm64), which is exactly what matrix.arch holds —
        # that's why the matrix uses GOARCH spellings rather than, say,
        # x64/aarch64.
        asset=argocd-linux-${{ matrix.arch }}
        curl -sSL -o "$asset" https://github.com/argoproj/argo-cd/releases/download/${{ env.ARGOCD_VERSION }}/"$asset"
        sudo install -m 555 "$asset" /usr/local/bin/argocd
        rm "$asset"
    - name: Install all dependencies
      run: task go:install-ci
    - name: Generate OpenAPI spec
      run: task go:generate
    - name: Bring up live stack
      run: task services:cicd
      env:
        # Per-arch scope: the two matrix legs build different-architecture
        # layers, and the image job caches a two-platform build. Sharing
        # buildx's default `buildkit` scope would have all three evicting
        # each other on every run.
        DOCKER_BUILD_CACHE_FLAGS: --cache-from type=gha,scope=e2e-${{ matrix.arch }} --cache-to type=gha,scope=e2e-${{ matrix.arch }},mode=max
    - name: Run Go e2e tests
      run: task go:test:e2e:ci
    - name: Install frontend packages
      run: task ts:install-ci
    - name: Cache Playwright browser
      id: playwright-cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        # See the ts job's copy — same cache, and this is the job that puts
        # arm64 browser binaries in it.
        key: playwright-${{ runner.os }}-${{ runner.arch }}-1.63.0
    - name: Install Playwright browser
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: node node_modules/playwright/cli.js install --with-deps chromium chromium-headless-shell
      working-directory: web
    - name: Run frontend live e2e suite
      run: task ts:test:e2e:live
    - name: Publish Unit Test Results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
        files: |
          report-e2e.xml
          web/test-results/junit-live.xml
        # See the go job's check_name comment. The arm64 leg's own JUnit
        # output is fully visible in its own check — it just doesn't enter
        # the report job's merge.
        check_name: E2E Test Results (${{ matrix.arch }})
    - name: Save JUnit report.
      uses: actions/upload-artifact@v7
      # amd64 only, here and below — see the go job's uploads.
      if: always() && matrix.arch == 'amd64'
      with:
        name: e2e-junit-report
        path: |
          ./report-e2e.xml
          web/test-results/junit-live.xml
    - name: Save coverage profile.
      # For the report job's centralized octocov run — see the same step in
      # the go job. This is the *only* place e2e's own Go coverage gets
      # surfaced anywhere; today it's generated and then never looked at
      # again once it leaves this job.
      uses: actions/upload-artifact@v7
      if: always() && matrix.arch == 'amd64'
      with:
        name: e2e-coverage-profile
        path: ./coverage-e2e.out

  image:
    # Builds exactly what release.yaml publishes, minus the push — and it is
    # the only job that exercises *cross*-compilation at all. The e2e arm64
    # leg builds the image natively, where BUILDPLATFORM == TARGETPLATFORM,
    # so GOOS/GOARCH are a no-op there. Without this job, a Dockerfile change
    # that breaks the cross-build passes every PR check and fails at release
    # time, after a tag exists and a GitHub Release is already published.
    #
    # Not in the report job's needs: it produces no JUnit or coverage
    # artifact, so waiting on a Docker build would buy that job nothing.
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Set up QEMU
      # Only for the runtime stage's `adduser`, which runs on the target
      # platform — see the Dockerfile. Every compile stage cross-compiles.
      uses: docker/setup-qemu-action@v4
      with:
        platforms: arm64
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Build both architectures
      uses: docker/build-push-action@v7
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: false
        cache-from: type=gha,scope=image-multiarch
        cache-to: type=gha,scope=image-multiarch,mode=max

  report:
    needs: [go, ts, e2e]
    if: always()
    runs-on: ubuntu-latest
    # Job-level permissions replace the workflow-level block entirely for
    # this job (they don't merge), so every scope its steps use has to be
    # re-listed here. actions: write moved here with octocov (workstream
    # 10 originally ran it in go) — it's for octocov's artifact:// datastore,
    # which reads/deletes prior coverage-report artifacts via the REST
    # Actions-artifacts API (authenticated with GITHUB_TOKEN, not the
    # separate runtime-token upload path actions/upload-artifact uses).
    permissions:
      contents: read
      checks: write
      pull-requests: write
      actions: write
    steps:
    - name: Checkout code
      # octocov needs the checked-out repo for .octocov.yml itself and for
      # git-root-relative path normalization — the JUnit-only version of
      # this job never needed one.
      uses: actions/checkout@v7
    - name: Download JUnit reports
      uses: actions/download-artifact@v8
      with:
        pattern: '*-junit-report'
        path: reports
        merge-multiple: true
    - name: Download coverage profiles
      # go's coverage.out and e2e's coverage-e2e.out land side by side here
      # (different filenames, no collision) — .octocov.yml's coverage.paths
      # lists both; octocov merges overlapping files itself (folding
      # duplicate-covered lines, not double-counting), so this becomes one
      # combined Go coverage report instead of go's slice alone. Each
      # pattern is globbed independently, so a go job that fails outright
      # (or, before ADR 0017, was skipped by the path filter) just leaves
      # that one glob empty rather than erroring — e2e always runs, so
      # there's always at least its coverage to report on.
      uses: actions/download-artifact@v8
      with:
        pattern: '*-coverage-profile'
        path: coverage
        merge-multiple: true
    - name: Report coverage via octocov
      # Pinned to the exact commit v1 (currently v1.5.2) resolves to, not the
      # mutable tag — this step runs with actions: write, so a repointed tag
      # could swap in code that runs with that elevated token.
      uses: k1LoW/octocov-action@a167dc0dee441b7ffc45e1b862ab55ec0d87f278 # v1.5.2
      with:
        config: .octocov.yml
        version: v0.79.0
    - name: Publish unified test results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
        files: reports/*.xml
        check_name: 'Unified Test Results'
