name: CI

on:
  push:
    branches:
      - 'main'
  pull_request:

permissions:
  checks: write
  pull-requests: write
  # For octocov's artifact:// datastore (workstream 10): it reads/deletes
  # prior coverage-report artifacts via the REST Actions-artifacts API
  # (authenticated with GITHUB_TOKEN, not the separate runtime-token upload
  # path actions/upload-artifact uses), which needs this scope explicitly —
  # defining any `permissions:` block sets every unlisted scope to `none`.
  actions: write

jobs:
  filter:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      ts: ${{ steps.filter.outputs.ts }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
    - uses: actions/checkout@v4
    - uses: dorny/paths-filter@v4
      id: filter
      with:
        filters: |
          go:
            - '**/*.go'
            - 'go.mod'
            - 'go.sum'
            - 'Taskfile.yaml'
            - 'tasks/go.yaml'
            - 'tasks/docker.yaml'
            - 'tasks/k8s.yaml'
            - 'tasks/argocd.yaml'
            - 'Dockerfile'
            - '.github/workflows/ci.yaml'
          ts:
            - 'web/**'
            - '.github/workflows/ci.yaml'
          docs:
            - 'docs/**'
            - '!docs/agents/**'
            - 'mkdocs.yml'
            - 'requirements.txt'
            - '.github/workflows/ci.yaml'

  go:
    needs: [filter]
    if: needs.filter.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.27
        cache: true   # default; explicit for clarity
    - name: Check formatting
      run: |
        gofmt -d .
        test -z "$(gofmt -l .)"
    - name: Install Task
      uses: arduino/setup-task@v2
    - name: Cache Go tool binaries
      uses: actions/cache@v6
      with:
        path: ~/go/bin
        key: go-tools-${{ hashFiles('tasks/go.yaml') }}
    - name: Install all dependencies
      run: task go:install-ci
    - name: Generate OpenAPI spec
      run: task go:generate
    - name: Lint code.
      run: task go:lint
    - name: Run tests.
      run: task go:test-ci
    - name: Publish Unit Test Results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
        files: report.xml
    - name: Report coverage via octocov
      uses: k1LoW/octocov-action@v1
      with:
        config: .octocov.yml
        version: v0.79.0
    - name: Save coverage report.
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: go-coverage-report
        path: ./coverage.html
    - name: Save JUnit report.
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: go-junit-report
        path: ./report.xml

  ts:
    needs: [filter]
    if: needs.filter.outputs.ts == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: web/package-lock.json
    - name: Install Task
      uses: arduino/setup-task@v2
    - name: Install packages
      run: task ts:install
    - name: Cache Playwright browser
      id: playwright-cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        # Literal version, not a hash of web/package.json — this needs to
        # match exactly what's installed, and an unrelated package.json
        # change shouldn't accidentally bust this cache.
        key: playwright-${{ runner.os }}-1.63.0
    - name: Install Playwright browser
      # Invoke the locally installed `playwright` package directly rather
      # than `npx playwright@<version>` — this project also depends on
      # `@playwright/test`, which provides its own (older-pinned) `playwright`
      # bin under the same name, and `npx` resolves to that one instead of
      # the version requested, silently installing the wrong browser
      # revision. `node node_modules/playwright/cli.js` bypasses the bin
      # collision and always uses the exact version in web/package.json.
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: node node_modules/playwright/cli.js install --with-deps chromium chromium-headless-shell
      working-directory: web
    - name: Run unit tests
      run: task ts:test:unit
    - name: Run mocked e2e tests
      run: task ts:test:e2e
    - name: Lint code
      run: task ts:lint
    - name: Build website
      run: task ts:build
    - name: Save JUnit report.
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ts-junit-report
        path: web/test-results/junit.xml

  docs:
    needs: [filter]
    if: needs.filter.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Install Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Install uv
      uses: astral-sh/setup-uv@v5
    - name: Install Task
      uses: arduino/setup-task@v2
    - name: Install dependencies
      run: task python:install:ci
    - name: Test docs
      run: task python:test

  e2e:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.27
        cache: true   # default; explicit for clarity
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: web/package-lock.json
    - name: Install Task
      uses: arduino/setup-task@v2
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Expose GitHub Actions cache variables for buildx
      uses: crazy-max/ghaction-github-runtime@v4
    - name: Cache Go tool binaries
      uses: actions/cache@v6
      with:
        path: ~/go/bin
        key: go-tools-${{ hashFiles('tasks/go.yaml') }}
    - name: Cache k3d/argocd CLIs
      id: cli-tools-cache
      uses: actions/cache@v6
      with:
        path: |
          /usr/local/bin/k3d
          /usr/local/bin/argocd
        # Neither version is derived from a hashed file — both are hardcoded
        # here and duplicated in .devcontainer/Dockerfile's K3D_VERSION arg
        # and argocd base-image tag. Keep this key in sync if either pin
        # is bumped.
        key: cli-tools-k3d-v5.9.0-argocd-v3.5.3
    - name: Install k3d
      # Keep in sync with K3D_VERSION in .devcontainer/Dockerfile.
      if: steps.cli-tools-cache.outputs.cache-hit != 'true'
      run: curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | TAG=v5.9.0 bash
    - name: Install argocd
      # Keep in sync with the argocd CLI version in .devcontainer/Dockerfile.
      if: steps.cli-tools-cache.outputs.cache-hit != 'true'
      run: |
        curl -sSL -o argocd-linux-amd64 https://github.com/argoproj/argo-cd/releases/download/v3.5.3/argocd-linux-amd64
        sudo install -m 555 argocd-linux-amd64 /usr/local/bin/argocd
        rm argocd-linux-amd64
    - name: Install all dependencies
      run: task go:install-ci
    - name: Generate OpenAPI spec
      run: task go:generate
    - name: Bring up live stack
      run: task services:cicd
      env:
        DOCKER_BUILD_CACHE_FLAGS: --cache-from type=gha --cache-to type=gha,mode=max
    - name: Run Go e2e tests
      run: task go:test:e2e:ci
    - name: Install frontend packages
      run: task ts:install
    - name: Cache Playwright browser
      id: playwright-cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-1.63.0
    - name: Install Playwright browser
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: node node_modules/playwright/cli.js install --with-deps chromium chromium-headless-shell
      working-directory: web
    - name: Run frontend live e2e suite
      run: task ts:test:e2e:live
    - name: Publish Unit Test Results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
        files: report-e2e.xml
    - name: Save JUnit report.
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: e2e-junit-report
        path: ./report-e2e.xml

  report:
    needs: [go, ts, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Download JUnit reports
      uses: actions/download-artifact@v4
      with:
        pattern: '*-junit-report'
        path: reports
        merge-multiple: true
    - name: Publish unified test results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
        files: reports/*.xml
        check_name: 'Unified Test Results'
