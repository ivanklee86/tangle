# https://taskfile.dev
version: '3'


tasks:
  password:
    desc: "Get ArgoCD password"
    cmds:
      - kubectl get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" | base64 -d; echo

  login:
    desc: "Log in to ArgoCD"
    cmds:
      - argocd login localhost:8080 --username {{ .ARGOCD_USERNAME }} --password {{ .ARGOCD_PASSWORD }} --plaintext --grpc-web --skip-test-tls
    vars:
      ARGOCD_USERNAME: admin
      ARGOCD_PASSWORD:
        sh: kubectl get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" | base64 -d; echo

  healthcheck:
    desc: "Wait for services to start"
    cmds:
      # Every ArgoCD workload, not just argocd-server: manifest generation goes through the
      # repo-server, which needs argocd-redis. Waiting only on argocd-server let e2e start while
      # Redis was still unavailable ("dial tcp ...:6379: connect: connection refused").
      - kubectl wait --for=condition=Available deployment -l app.kubernetes.io/part-of=argocd --timeout=300s
      - kubectl rollout status statefulset/argocd-application-controller --timeout=300s
      - kubectl wait --for=condition=Ready pod -l app.kubernetes.io/name=traefik --timeout=300s

  token:
    desc: "Generate token for service account."
    cmds:
      - task: login
      - ./scripts/template_dotenv.sh
