# https://taskfile.dev

version: '3'

vars:
  BUILD_DIR: bin
  TEST_REPORT: tests.xml
  COVERAGE_RAW: coverage.out
  COVERAGE_REPORT: coverage.html
  VERSION: "Task"

env:
  TANGLE_CONFIG_PATH: "./integration/tangle.yaml"

tasks:
  install:
    desc: Installs Golang dependencies and testing tools.
    cmds:
      - go get ./...

  install-ci:
    desc: Install packages and CI/CD tools.
    cmds:
      - task: install
      - go install github.com/jstemmer/go-junit-report/v2@v2.1.0
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
      - go install github.com/hairyhenderson/gomplate/v5/cmd/gomplate@v5.2.0
      - go install github.com/go-swagger/go-swagger/cmd/swagger@v0.36.6

  build:
    desc: Builds binary.
    cmds:
      - task: generate
      - mkdir -p {{.BUILD_DIR}}
      - go build -ldflags "-X main.version=${VERSION}" -o {{.BUILD_DIR}} ./...

  generate:
    desc: Generate code.
    cmds:
      - swagger generate spec -o ./internal/tangle/swagger.json --scan-models

  fmt:
    desc: Formats Golang code.
    cmds:
      - go fmt $(go list ./...)

  lint:
    desc: Lints Golang code.
    cmds:
      - golangci-lint run --timeout 5m

  run:
    desc: Run server
    cmds:
      - task: generate
      - go run cmd/tangle-server/main.go

  run:reloading:
    desc: Run server with hot reloading.
    cmds:
      - task: generate
      - air -c .air.conf

  test:
    desc: Run Golang tests.
    cmds:
      - go test -v ./... 2>&1

  test-ci:
    desc: Run Golang tests and generate coverage report.
    cmds:
      - go test --coverprofile {{.COVERAGE_RAW}} -v ./... 2>&1  | tee >(go-junit-report > report.xml)
      - go tool cover -html={{.COVERAGE_RAW}} -o {{.COVERAGE_REPORT}}

  test:e2e:
    desc: Run Golang e2e tests (needs a live ArgoCD — see `task services:cicd`).
    cmds:
      # -tags=e2e adds the //go:build e2e files to the build, it doesn't
      # remove the untagged ones — -run selects just the TestE2E_-prefixed
      # tests so this doesn't also re-run every unit/integration test.
      - go test -tags=e2e -run '^TestE2E_' -v ./... 2>&1

  test:e2e:ci:
    desc: Run Golang e2e tests and generate coverage report, for CI.
    vars:
      COVERAGE_RAW: coverage-e2e.out
      COVERAGE_REPORT: coverage-e2e.html
    cmds:
      - go test -tags=e2e -run '^TestE2E_' --coverprofile {{.COVERAGE_RAW}} -v ./... 2>&1 | tee >(go-junit-report > report-e2e.xml)
      - go tool cover -html={{.COVERAGE_RAW}} -o {{.COVERAGE_REPORT}}
