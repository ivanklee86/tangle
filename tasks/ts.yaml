# https://taskfile.dev

version: '3'

vars:
  STATIC_DIR: build

tasks:
  default:
    desc: Run all tasks
    cmds:
      - task: fmt
      - task: lint
      - task: build

  build:
    desc: Build the project
    dir: web
    cmds:
      - rm -rf ../{{.STATIC_DIR}}
      - mkdir  ../{{.STATIC_DIR}} || true
      - npm run build
      - cp -r build/* ../{{.STATIC_DIR}}

  fmt:
    desc: Format the code
    dir: web
    cmds:
      - npm run format

  install:
    desc: Install dependencies
    dir: web
    cmds:
      - npm install

  lint:
    desc: Lint the code
    dir: web
    cmds:
      - npm run check
      - npm run lint

  test:
    desc: Run tests
    dir: web
    cmds:
      - task: test:unit
      - task: test:e2e

  test:unit:
    desc: Run unit tests.
    dir: web
    cmds:
      - npm run test:unit -- --run

  test:e2e:
    desc: Run the mocked (integration-layer) Playwright suite.
    dir: web
    cmds:
      - npm run test:e2e

  test:e2e:live:
    desc: Run the live-stack Playwright suite against `task services:cicd`.
    dir: web
    cmds:
      - npx playwright test --config=playwright.live.config.ts

  dev:
    desc: Run the development server
    dir: web
    cmds:
      - npm run dev

  screenshots:
    desc: Regenerate the README's web-UI screenshots from the running app (needs `task services` + tangle-server up)
    dir: web
    cmds:
      - npm run screenshots
