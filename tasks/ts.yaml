# https://taskfile.dev

version: '3'

vars:
  STATIC_DIR: build

tasks:
  default:
    desc: Run all tasks
    cmds:
      - task: fmt
      - task: lint
      - task: build

  build:
    desc: Build the project
    dir: web
    cmds:
      - rm -rf ../{{.STATIC_DIR}}
      - mkdir  ../{{.STATIC_DIR}} || true
      - npm run build
      - cp -r build/* ../{{.STATIC_DIR}}

  fmt:
    desc: Format the code
    dir: web
    cmds:
      - npm run format

  install:
    desc: Install dependencies
    dir: web
    cmds:
      - npm install

  install-ci:
    desc: Install dependencies from the lockfile, exactly (CI).
    dir: web
    cmds:
      - npm ci

  lint:
    desc: Lint the code
    dir: web
    cmds:
      - npm run check
      - npm run lint

  test:
    desc: Run tests
    dir: web
    cmds:
      - task: test:unit
      - task: test:e2e

  test:unit:
    desc: Run unit tests.
    dir: web
    cmds:
      - npm run test:unit -- --run

  test:e2e:
    desc: Run the mocked (integration-layer) Playwright suite.
    dir: web
    cmds:
      - npm run test:e2e

  test:e2e:live:
    desc: Run the live-stack Playwright suite against `task services:cicd`.
    dir: web
    cmds:
      - npx playwright test --config=playwright.live.config.ts

  dev:
    desc: Run the development server
    dir: web
    cmds:
      - npm run dev

  test:visual:
    desc: Compare the UI against the screenshot baselines, in the pinned Playwright Docker image (see docs/agents/plans/2026-11-26-visual-regression-tests.md).
    dir: web
    cmds:
      - scripts/playwright-docker.sh --project=visual {{.CLI_ARGS}}

  test:visual:update:
    desc: Regenerate the screenshot baselines after an intended UI change, in the pinned Playwright Docker image.
    dir: web
    cmds:
      - scripts/playwright-docker.sh --project=visual --update-snapshots {{.CLI_ARGS}}

  screenshots:
    desc: Regenerate the README and docs web-UI screenshots from the fixture fleet, in the pinned Playwright Docker image (no backend needed).
    dir: web
    cmds:
      - scripts/playwright-docker.sh --project=docs
