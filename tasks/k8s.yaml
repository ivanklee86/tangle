# https://taskfile.dev

version: '3'

vars:
  CLUSTER_NAME: local

tasks:
  start:
    desc: "Start :allthethings:!"
    cmds:
      - task: cluster:create
      - task: bootstrap

  # Cluster management
  cluster:create:
    desc: "Create k3d cluster."
    cmds:
      - k3d cluster create {{.CLUSTER_NAME}} --config ./k3d-config.yaml
      - kubectl get nodes

  cluster:delete:
    desc: "Clean up k3d cluster."
    ignore_error: true
    cmds:
      - k3d cluster delete {{.CLUSTER_NAME}}

  cluster:config:
    desc: "Get k3d cluster config."
    cmds:
      - mkdir ~/.kube || true
      - k3d kubeconfig get {{.CLUSTER_NAME}} > ~/.kube/config

  # Handy Helm shortcuts
  helm:update:
    desc: Update helm dependencies.
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - helm dep update

  helm:template:
    desc: Update helm dependencies.
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - task: helm:update
      - helm template --values values.yaml . > manifests.yaml

  # App deployments.
  bootstrap:
    desc: "Bootstrap apps"
    cmds:
      # Traefik (and the Gateway API CRDs it and argocd's HTTPRoute depend on) must exist before
      # the argocd chart, since its HTTPRoute template needs the Gateway API CRDs installed.
      - task: bootstrap:traefik
      - task: bootstrap:argocd
      - task: bootstrap:application

  bootstrap:argocd:
    desc: "Bootstrap ArgoCD."
    cmds:
      - helm repo add argocd https://argoproj.github.io/argo-helm
      - cd integration/kubernetes/argocd; helm dependency build
      - helm install argocd integration/kubernetes/argocd --namespace default

  bootstrap:traefik:
    desc: "Bootstrap Gateway API CRDs and Traefik."
    cmds:
      - kubectl apply --server-side -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.6.2/standard-install.yaml
      - helm repo add traefik https://traefik.github.io/charts
      - cd integration/kubernetes/traefik; helm dependency build
      - helm install traefik integration/kubernetes/traefik --namespace default

  bootstrap:application:
    desc: "Bootstrap testing application"
    cmds:
      - kubectl apply -f integration/kubernetes/example/project.yaml
      - kubectl apply -f integration/kubernetes/example
