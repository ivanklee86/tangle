name: "tangle"
# The public address of this Tangle, used for the links the web UI offers to
# copy. Points at where this stack actually serves so the e2e suites exercise
# a real configured domain rather than one that resolves nowhere.
domain: "http://localhost:8081"
port: 8081

listWorkers: 20
manifestsWorkers: 10
hardRefreshWorkers: 10

argocds:
  test:
    address: "localhost:8080"
    plainText: true
    authTokenEnvVar: "ARGOCD_TOKEN"
  prod:
    address: "localhost:8080"
    plainText: true
    authTokenEnvVar: "ARGOCD_PROD_TOKEN"

sortOrder:
  - test
  - prod
