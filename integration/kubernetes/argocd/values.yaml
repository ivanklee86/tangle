argo-cd:
  configs:
    cm:
      accounts.automation: apiKey
      accounts.automationProd: apiKey

    rbac:
      policy.csv: |
        p, role:automation, applications, get, default/*, allow
        g, automation, role:automation
        p, role:automationProd, applications, get, my-project/*, allow
        g, automationProd, role:automationProd

    params:
      server.insecure: true

  redis:
    image:
      # The chart's default, ecr-public.aws.com/docker/library/redis, is the same official image, but
      # ECR Public answers anonymous pulls from shared GitHub runner IPs with 429 Too Many Requests,
      # leaving argocd-redis in ImagePullBackOff. The tag is left to the chart so bumps stay in step.
      # See docs/adrs/0030-pull-argocd-redis-from-docker-hub.md.
      repository: docker.io/library/redis
