apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: two-repos
  labels:
    suite: sources
    source: multi-source
spec:
  project: sources
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  sources:
    - repoURL: https://github.com/argoproj/argocd-example-apps.git
      path: guestbook
      targetRevision: 8088f4c0d970abb09e250248cc97e35623447cb5
    - repoURL: https://github.com/ivanklee86/tangle-integration-manifests.git
      path: two-repos
      targetRevision: main
