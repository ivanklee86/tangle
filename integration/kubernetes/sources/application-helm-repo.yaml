apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: helm-repo
  labels:
    suite: sources
    source: helm-repo
spec:
  project: sources
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  source:
    repoURL: https://stefanprodan.github.io/podinfo
    chart: podinfo
    targetRevision: 6.17.0
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
