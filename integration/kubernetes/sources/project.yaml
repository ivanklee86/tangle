# The source-type fixture Applications, apart from the scenario apps in ../example/: only the automationSources
# token (the `sources` ArgoCD in integration/tangle.yaml) can see this project, so adding an app here never changes
# what the scenario apps' queries return.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: sources
spec:
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  destinations:
    - namespace: '*'
      server: '*'
  sourceRepos:
    - '*'
