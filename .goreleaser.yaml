version: 2
before:
  hooks:
    - go mod tidy
builds:
  - id: "tangle-cli"
    binary: tangle-cli
    main: ./cmd/tangle-cli
    ldflags:
      - -X main.version={{.Version}}
changelog:
  disable: true
homebrew_casks:
  - name: tangle-cli
    homepage: "https://github.com/ivanklee86/tangle"
    description: "A CLI to configure/clear SyncWindows on ArgoCD projects."
    directory: Casks
    binaries:
      - tangle-cli
    # Release binaries are unsigned, so macOS Gatekeeper quarantines them on
    # download and refuses to run them. Strip the attribute after staging.
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/tangle-cli"]
          end
    repository:
      owner: ivanklee86
      name: homebrew-tap
      token: "{{ .Env.GITHUB_HOMBREW_AUTH_TOKEN }}"
