kind: Simple
apiVersion: k3d.io/v1alpha5
servers: 1
agents: 1
ports:
  - port: 8080:80
    nodeFilters:
      - loadbalancer
options:
  k3d:
    wait: true
  k3s:
    extraArgs:
      # k3s's bundled Traefik is disabled in favor of a pinned Traefik Helm install
      # (integration/kubernetes/traefik), matching how the rest of the stack's versions are pinned.
      - arg: --disable=traefik
        nodeFilters:
          - server:*
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: true
  runtime: {}
